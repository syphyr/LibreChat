version: 1.3.18
cache: true

endpoints:
  allowedAddresses:
    - 'ollama:11434'
    - 'stable-diffusion-vulkan:1234'
    - 'kokoro-fastapi:8880'
    - 'whisper-stt:8000'
    - 'searxng-core:8080'

  agents:
    capabilities:
      - 'tools'
      - 'actions'
      - 'context'
      - 'artifacts'

  custom:
    - name: 'Ollama'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1/'
      models:
        default: ['qwen3.6-uncensored:35b-a3b']
        fetch: true
      titleConvo: false
      summarize: true
      summaryModel: 'qwen3.6-uncensored:35b-a3b'

memory:
  disabled: true
  personalize: true
  tokenLimit: 1000
  messageWindowSize: 2
  validKeys:
    - 'user_preferences'
    - 'learned_facts'
    - 'conversation_context'
    - 'system_setup'
  agent:
    provider: 'Ollama'
    model: 'qwen3.6-uncensored:35b-a3b'

mcpServers:
  searxng:
    type: stdio
    command: npx
    args:
      - '-y'
      - 'mcp-searxng'
    env:
      SEARXNG_URL: 'http://searxng-core:8080'
      NO_PROXY: 'searxng-core,localhost,127.0.0.1'

  stable-diffusion:
    type: stdio
    command: node
    args:
      - '/app/sd-mcp.js'
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      NO_PROXY: 'stable-diffusion-vulkan,localhost,127.0.0.1'

speech:
  tts:
    allowedAddresses:
      - 'kokoro-fastapi:8880'
    openai:
      url: 'http://kokoro-fastapi:8880/v1/audio/speech'
      apiKey: 'sk-1234'
      model: 'kokoro'
      voices:
        - 'af_heart'
        - 'af_bella'
        - 'af_nova'
        - 'af_sky'
        - 'am_adam'
        - 'am_michael'
        - 'bf_emma'
        - 'bm_george'
      params:
        response_format: 'wav'
  stt:
    allowedAddresses:
      - 'whisper-stt:8000'
    openai:
      url: 'http://whisper-stt:8000/v1/audio/transcriptions'
      apiKey: 'not-needed'
      model: 'Systran/faster-whisper-base.en'
  speechTab:
    speechToText:
      engineSTT: 'external'
      languageSTT: 'en'
    textToSpeech:
      engineTTS: 'external'
      voice: 'af_bella'
