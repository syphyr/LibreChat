version: 1.3.19
cache: true

endpoints:
  allowedAddresses:
    - 'ollama:11434'
    - 'stable-diffusion-vulkan:1234'
    - 'kokoro-fastapi:8880'
    - 'whisper-stt:8000'
    - 'searxng-core:8080'

  agents:
    capabilities:
      - 'tools'
      - 'actions'
      - 'context'
      - 'artifacts'
      - 'memory'
      - 'file_search'

  custom:
    - name: 'Ollama'
      apiKey: 'ollama'
      baseURL: 'http://ollama:11434/v1/'
      models:
        default: ['MiniCPM-V-4.7-35B-A3B-abliterated2-i1-GGUF:Q4_K_M']
        fetch: true
      addParams:
        promptPrefix: 'When calling the Stable Diffusion image generation tool, ALWAYS set width=704, height=704, steps=8, cfg_scale=1.5, and sampler_index="Euler a".'
      titleConvo: false
      summarize: true
      summaryModel: 'qwen3:4b-instruct'

memory:
  disabled: false
  personalize: true
  tokenLimit: 1000
  messageWindowSize: 2
  validKeys:
    - 'user_preferences'
    - 'learned_facts'
    - 'conversation_context'
    - 'system_setup'
  agent:
    enabled: true
    provider: 'Ollama'
    model: 'qwen3:4b-instruct'
    instructions: 'You are a memory extraction assistant. Whenever the user asks you to remember or save information, or mentions personal preferences, hardware/software details, or project facts, you MUST call the set_memory tool immediately using the best matching key from validKeys (user_preferences, learned_facts, conversation_context, system_setup).'

mcpServers:
  searxng:
    type: stdio
    command: npx
    args:
      - '-y'
      - 'mcp-searxng'
    env:
      SEARXNG_URL: 'http://searxng-core:8080'
      NO_PROXY: 'searxng-core,localhost,127.0.0.1'

  stable-diffusion:
    type: stdio
    command: node
    args:
      - '/app/sd-mcp.js'
    env:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      NO_PROXY: 'stable-diffusion-vulkan,localhost,127.0.0.1'

speech:
  tts:
    allowedAddresses:
      - 'kokoro-fastapi:8880'
    openai:
      url: 'http://kokoro-fastapi:8880/v1/audio/speech'
      apiKey: 'sk-1234'
      model: 'kokoro'
      voices:
        - 'af_heart'
        - 'af_bella'
        - 'af_nova'
        - 'af_sky'
        - 'am_adam'
        - 'am_michael'
        - 'bf_emma'
        - 'bm_george'
      params:
        response_format: 'wav'
  stt:
    allowedAddresses:
      - 'whisper-stt:8000'
    openai:
      url: 'http://whisper-stt:8000/v1/audio/transcriptions'
      apiKey: 'not-needed'
      model: 'Systran/faster-whisper-base.en'
  speechTab:
    speechToText:
      engineSTT: 'external'
      languageSTT: 'en'
    textToSpeech:
      engineTTS: 'external'
      voice: 'af_bella'

fileConfig:
  endpoints:
    Ollama:
      fileLimit: 5
      fileSizeLimit: 20    # Max 20 MB per file
      totalSizeLimit: 50   # Max 50 MB per message
    agents:
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
  serverFileSizeLimit: 50  # Global max upload size in MB
  avatarSizeLimit: 2
